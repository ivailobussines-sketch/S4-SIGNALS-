name: S4 Telegram scanner

on:
  schedule:
    - cron: "*/15 * * * 1-5"
    - cron: "*/15 21-23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s4-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state (prevents duplicate alerts)
        uses: actions/cache@v4
        with:
          path: state.json
          key: s4-state-${{ github.run_id }}
          restore-keys: s4-state-

      - name: Scan live market and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT_HOUR: ${{ vars.HEARTBEAT_HOUR }}
        run: python s4_scanner.py --channel telegram

      - name: Keep the latest state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: s4-state-${{ github.run_id }}
